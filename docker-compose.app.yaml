services:
  rocketmq-broker:
    volumes:
      - ./broker-docker.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf

  app:
    build: .
    container_name: user-points-service
    ports:
      - "${APP_PORT:-8081}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taskdb?serverTimezone=UTC&characterEncoding=utf8
      SPRING_DATA_REDIS_HOST: redis
      ROCKETMQ_NAMESERVER: rocketmq-namesrv:9876
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started is enough: the outbox keeps events until the broker is ready.
      rocketmq-broker:
        condition: service_started
    # Longer than the 15 s graceful shutdown, so Docker does not kill the app while it drains.
    stop_grace_period: 30s
    restart: on-failure
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8080/user-points-service/points/leaderboard"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
