spring:
  application:
    name: user-points-service
  config:
    import: redis-cache.yaml, caffeine-cache.yaml, rocketmq.yaml

  datasource:
    url: jdbc:mysql://localhost:3306/taskdb?serverTimezone=UTC&characterEncoding=utf8
    username: taskuser
    password: taskpass
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  transaction:
    default-timeout: 5
  lifecycle:
    timeout-per-shutdown-phase: 15s
  task:
    execution:
      mode: force
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

server:
  shutdown: graceful
  servlet:
    context-path: /user-points-service

logging:
  pattern:
    # Class name instead of %C/%M/%L: caller data walks the stack on every log call.
    console: "[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%X{requestId}] [%clr(%p)] [%t] [%logger{0}] - %m%n%wEx"
