spring:
  application:
    name: user-points-service
  config:
    import: redis-cache.yaml, caffeine-cache.yaml

  datasource:
    url: jdbc:mysql://localhost:3306/taskdb?serverTimezone=UTC&characterEncoding=utf8
    username: taskuser
    password: taskpass
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  transaction:
    default-timeout: 5
  lifecycle:
    timeout-per-shutdown-phase: 15s
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

server:
  shutdown: graceful
  servlet:
    context-path: /user-points-service

logging:
  pattern:
    correlation: "%replace([%X{requestId}] ){'^\\[\\] $', ''}"
